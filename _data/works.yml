  pdf: /assets/works/2611.0004/toric_Fano_MY_2026_1119.pdf
  ja:
    authors: 岩井 雅崇
    title: トーリックFano多様体に対するδ補正付きMiyaoka–Yau不等式の組合せ論的証明
    summary: 反標準多面体を用いて、射影kltトーリックFano多様体に対するδ補正付きMiyaoka–Yau不等式の組合せ論的証明を与える原稿。13ページ。
    comments: この原稿はAIが生成したもので、人間による検証は行っていません。ご関心のある方は岩井までご連絡ください。ご相談のうえ、共同研究として進めることや、結果をお譲りすることを考えています。AIが得た結果は、みんなのものだと考えています。
  en:
    authors: Masataka Iwai
    title: A Combinatorial Proof of the Delta-Corrected Miyaoka–Yau Inequality for Toric Fano Varieties
    summary: A manuscript giving a combinatorial proof of the delta-corrected Miyaoka–Yau inequality for projective klt toric Fano varieties via their anticanonical polytopes. 13 pages.
    comments: This manuscript was generated by AI and has not been verified by a human. If you are interested, please contact Iwai. I would be happy to discuss working together on this or handing the result over to you. I believe results obtained by AI belong to everyone.

